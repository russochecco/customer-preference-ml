[project]
name = "customer-preference-ml"
version = "0.1.0"
description = ""
authors = [
    { name = "Francesco Russo", email = "russo.checco@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12,<4"

dependencies = [
    "pyspark==4.2.0",
    "numpy==2.0.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0"
]

[tool.poetry]
packages = [{include = "customer_preference_ml", from = "src"}]


[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"